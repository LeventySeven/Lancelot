[package]
name = "lancelot"
version = "0.0.0"
edition = "2021"
rust-version = "1.78"

[lib]
name = "lancelot"
crate-type = ["cdylib", "rlib"]

[dependencies]
# NOTE (deviation from plan Task 1 Step 2, deliberate & required): `extension-module`
# is intentionally NOT set here. It must apply ONLY to the maturin-built cdylib
# (Python supplies the CPython symbols at import time); when set unconditionally it
# makes `cargo test` / `trybuild` / `cargo run --bin alloc_probe` fail to link
# (undefined __Py_IncRef/__Py_DecRef). maturin re-adds it for the wheel via
# pyproject.toml `[tool.maturin] features = ["pyo3/extension-module"]`. This is the
# canonical pyo3+maturin setup; the plan's literal Cargo.toml is a defect.
pyo3 = { version = "0.27", features = ["abi3-py311"] }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
http = "1"
tower = { version = "0.5", features = ["util"] }
# `all` feature required for set_reuse_port (plan's bare `socket2 = "0.5"`
# is a defect — set_reuse_port is gated behind socket2's `all` feature).
socket2 = { version = "0.5", features = ["all"] }
matchit = "0.8"
bytes = "1"
dhat = { version = "0.3", optional = true }

[dev-dependencies]
trybuild = "1"

[features]
dhat-heap = ["dep:dhat"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"

# Spec §2/§5: the no-await-holding-the-GIL invariant is guarded by BOTH the
# trybuild negative-compile-test (Task 2) AND a clippy deny-set. The type-level
# `with_gil` enforcement covers our own GIL scope; this catches any std lock /
# RefCell guard held across `.await` in later tasks (e.g. the dispatch pump).
[lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
