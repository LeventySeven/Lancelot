# M5 exit-gate nginx config — Phase C VPS (production-scale deploy).
#
# Terminates TLS in front of the 4 framework processes, each on its own
# port. The bench client (oha / soak.py / ttft_collector.py) hits
# https://<host>/<framework>/... — nginx forwards the request body to
# the appropriate upstream + streams the response back.
#
# Place at /etc/nginx/sites-available/lancelot-m5 and symlink to
# sites-enabled (handled by deploy_vps.sh).

# Lancelot
upstream u_lancelot { server 127.0.0.1:8910; keepalive 64; }
# FastAPI
upstream u_fastapi  { server 127.0.0.1:8911; keepalive 64; }
# Robyn
upstream u_robyn    { server 127.0.0.1:8912; keepalive 64; }
# Blazeio
upstream u_blazeio  { server 127.0.0.1:8913; keepalive 64; }
# Mock LLM/vector backend (private)
upstream u_upstream { server 127.0.0.1:8901; keepalive 64; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let LB / cert renewal know the VPS responds.
    location /healthz {
        return 200 "lancelot-m5 vps ok\n";
    }

    # Per-framework route prefix → strip and forward.
    location /lancelot/ {
        rewrite ^/lancelot/(.*)$ /$1 break;
        proxy_pass http://u_lancelot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location /fastapi/ {
        rewrite ^/fastapi/(.*)$ /$1 break;
        proxy_pass http://u_fastapi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location /robyn/ {
        rewrite ^/robyn/(.*)$ /$1 break;
        proxy_pass http://u_robyn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location /blazeio/ {
        rewrite ^/blazeio/(.*)$ /$1 break;
        proxy_pass http://u_blazeio;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # NOTE: TLS termination — see comments in deploy_vps.sh. After running
    # certbot, this block will be replaced by an `server { listen 443 ssl …}`
    # variant. Plain :80 is the pre-cert state.
}
